[package]
name = "lectures_offline"
version = "0.1.0"
description = "Offline lectures and homework app"
edition = "2021"

[lib]
name = "lectures_offline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
local-ip-address = "0.6"
rfd = "0.15"
